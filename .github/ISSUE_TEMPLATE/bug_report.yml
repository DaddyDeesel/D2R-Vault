name: Bug report
description: Report a reproducible problem in D2R Treasure Vault
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing D2R Treasure Vault. Do not upload your items.db or user-data folder unless you explicitly intend to share that data.
  - type: input
    id: version
    attributes:
      label: D2R Treasure Vault version
      placeholder: v0.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Startup or database selection
        - Inventory or filters
        - Item Locator
        - Inventory Log
        - Pricing or d2jsp post
        - Packaging or shutdown
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest repeatable sequence.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include whether restart reproduces it. Screenshots should hide private account and character names. Review reader.log for local paths before attaching it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked my attachments for account names, character names, and local file paths.
          required: true
